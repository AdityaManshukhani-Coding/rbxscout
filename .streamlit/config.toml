[theme]
base = "dark"
# UpScale Scouting Tool palette — tokens documented in BRAND.md; keep in sync
# with generate_brand_assets.py. UpScale Orange (#FF6E01, sampled from the
# owner's logo) is the brand primary; Scout Green is retired.
primaryColor = "#FF6E01"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#12161E"
textColor = "#E7ECF3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

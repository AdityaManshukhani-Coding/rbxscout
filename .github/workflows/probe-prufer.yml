name: Atlas prufer reachability probe
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Phase 0 per-tier coverage probe via free proxies
        run: |
          pip install -q requests
          python - <<'EOF'
          import requests, time, random, collections, concurrent.futures as cf
          UA = {"User-Agent": "UpScaleScoutingTool/1.0 (Roblox game discovery; contact via repo)",
                "Accept": "application/json"}
          BASE = "https://atlasdev.gg/api/prufer/universe-metric-series"
          THRESH = {1:(25000,25),2:(50000,75),3:(75000,150),4:(100000,200),5:(200000,250),6:(500000,550),7:(1000000,1000)}
          def tier(v, c):
              def ax(val, idx):
                  for t in sorted(THRESH, reverse=True):
                      if val >= THRESH[t][idx]: return t
                  return 0
              return max(ax(v,0), ax(c,1))
          # pool: validate proxies in parallel first
          lists = ["https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
                   "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"]
          pool = []
          for u in lists:
              try: pool += [x.strip() for x in requests.get(u, timeout=15).text.splitlines() if x.strip()]
              except Exception: pass
          pool = list(dict.fromkeys(pool)); random.shuffle(pool)
          def px_ok(px):
              try:
                  r = requests.get(f"{BASE}/994732206", params={"days":1,"bucket":"1d"}, headers=UA,
                                   proxies={"http":f"http://{px}","https":f"http://{px}"}, timeout=8)
                  return px if r.status_code == 200 and '"series"' in r.text else None
              except Exception: return None
          good = []
          with cf.ThreadPoolExecutor(60) as ex:
              for res in ex.map(px_ok, pool[:1400]):
                  if res: good.append(res)
          print(f"validated pool: {len(good)}/{len(pool[:1400])}")
          # load targets
          import base64
          ids = []
          # committed file read
          with open("probe_ids.csv") as f:
              for line in f:
                  uid, v, c = line.strip().split(",")
                  ids.append((int(uid), int(v), int(c)))
          print(f"targets: {len(ids)}")
          t0 = time.time()
          stats = collections.defaultdict(lambda: collections.Counter())
          random.shuffle(ids)
          giter = list(good); gi = [0]
          lock = __import__("threading").Lock()
          def nxt():
              with lock:
                  px = giter[gi[0] % len(giter)]; gi[0] += 1; return px
          def fetch(item):
              uid, v, c = item
              px = nxt()
              try:
                  r = requests.get(f"{BASE}/{uid}", params={"days":2,"bucket":"1h"}, headers=UA,
                                   proxies={"http":f"http://{px}","https":f"http://{px}"}, timeout=10)
                  if r.status_code != 200: return (uid, v, c, f"http{r.status_code}")
                  s = r.json().get("series") or []
                  if not s: return (uid, v, c, "empty")
                  last = s[-1].get("bucket","")
                  try:
                      ts = time.mktime(time.strptime(last[:19], "%Y-%m-%dT%H:%M:%S"))
                      age_h = (time.time() - ts)/3600
                  except Exception:
                      return (uid, v, c, "baddate")
                  return (uid, v, c, f"fresh{age_h:.1f}")
              except Exception:
                  return (uid, v, c, "err")
          with cf.ThreadPoolExecutor(50) as ex:
              for uid, v, c, outcome in ex.map(fetch, ids):
                  t = tier(v, c)
                  if outcome.startswith("fresh"):
                      age = float(outcome[5:])
                      stats[t]["series"] += 1
                      stats[t]["fresh2h" if age < 2 else ("fresh24h" if age < 24 else "stale")] += 1
                  else:
                      stats[t][outcome] += 1
          print(f"probe done in {time.time()-t0:.0f}s")
          print(f"{'tier':>4} {'n':>6} {'series':>7} {'<2h':>6} {'<24h':>6} {'stale':>6} {'empty':>6} {'other':>6}")
          for t in sorted(stats):
              s = stats[t]; n = sum(s.values()); ser = s["series"]
              print(f"T{t}  {n:>6} {ser:>7} {s['fresh2h']:>6} {s['fresh24h']:>6} {s['stale']:>6} {s['empty']:>6} {sum(v for k,v in s.items() if k not in ('series','fresh2h','fresh24h','stale','empty')):>6}")
          tot = {k: sum(s[k] for s in stats.values()) for k in ("series","fresh2h","fresh24h","stale","empty")}
          print("TOTALS:", tot)
          EOF

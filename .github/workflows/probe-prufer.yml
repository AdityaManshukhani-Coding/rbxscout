name: Atlas prufer reachability probe
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free public proxy test against atlasdev.gg
        run: |
          pip install -q requests
          python - <<'EOF'
          import requests, random, concurrent.futures as cf
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"}
          urls = [
              "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt",
              "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt",
          ]
          proxies = []
          for u in urls:
              try:
                  proxies += [x.strip() for x in requests.get(u, timeout=15).text.splitlines() if x.strip()]
              except Exception as e:
                  print("list fetch failed:", u, str(e)[:80])
          print("proxy pool:", len(proxies))
          random.shuffle(proxies)
          def test(px):
              try:
                  r = requests.get("https://atlasdev.gg/api/prufer/universe-metric-series/994732206?days=1&bucket=1d",
                                   headers=UA, proxies={"http": f"http://{px}", "https": f"http://{px}"}, timeout=8)
                  return (px, r.status_code, r.text[:60] if r.status_code == 200 else "")
              except Exception:
                  return None
          ok = []
          with cf.ThreadPoolExecutor(30) as ex:
              for res in ex.map(test, proxies[:400]):
                  if res and res[1] == 200:
                      ok.append(res)
          print(f"tested 400 proxies, working against atlasdev.gg: {len(ok)}")
          for px, code, body in ok[:15]:
              print("WORKS:", px, body)
          EOF

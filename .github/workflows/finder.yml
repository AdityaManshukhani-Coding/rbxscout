# RbxScout finder — the discovery pass (every 10 minutes).
#
# Grows the catalog: front-page charts + Rolimons pool + the next
# 100-keyword slice of the ~14.7k-word dictionary (662 curated seeds + a
# deterministic bases×modifiers expansion — a full sweep takes ~24h at
# this cadence). Every candidate found is hydrated immediately (a new game
# has no stats yet, so it cannot be tiered — that first hydration is
# mandatory). The known-game refresh queue is NOT drained here: that is
# the hydrator workflow's job, so a slow keyword crawl can never starve
# hot games' stats again.
#
# The catalog lives on the rolling Release `catalog-latest` in this repo
# (asset rbx_scout.db), NOT in git commits: pull -> sync -> push. The
# keyword-crawl cursor advances inside the SQLite file, so it persists in
# the release asset — push happens on every run, success or not.
#
# Race safety is unchanged: both workflows declare the SAME Actions
# concurrency group (`rbxscout-sync`), a repo-wide mutex enforced by
# GitHub, so two pull/sync/push cycles can never interleave.
#
# Manual runs: Actions tab -> "Finder (10 min)" -> "Run workflow"

name: Finder (10 min)

on:
# Automatic dispatching is owned by the Cloudflare Worker in
# cloudflare-worker/wrangler.toml. Keep only workflow_dispatch here.
  workflow_dispatch:

permissions:
  contents: write   # create/update the catalog-latest release assets

env:
  # Search-proxy fallback pool for the keyword crawler: the omni-search
  # endpoint throttles GitHub runner IPs, so keyword requests are tried
  # through these Cloudflare Worker mirrors first and fall back to direct
  # Roblox last. Add a repo variable (Settings -> Secrets and variables ->
  # Actions -> Variables) named RBXSCOUT_SEARCH_PROXY_URLS holding the
  # worker URL(s), comma-separated. Leave empty to crawl direct-only.
  RBXSCOUT_SEARCH_PROXY_URLS: ${{ vars.RBXSCOUT_SEARCH_PROXY_URLS || '' }}

# ⚠️ Keep this group IDENTICAL to hydrator.yml — the shared literal string
# IS the cross-workflow mutex. Changing one without the other re-opens
# the two-writer race on the catalog release.
concurrency:
  group: rbxscout-sync
  queue: max                 # retain dispatches while another workflow runs

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # pacer can stretch on 429s; 30 min is generous

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Export release-store credentials
        run: echo "RBXSCOUT_GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Set up Python 3.14 (matches the tested local env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull catalog from release store
        run: python db_sync.py pull

      - name: Run test suite (protects the catalog from bad pushes)
        run: python -m pytest tests -q

      - name: Run finder (discovery + keyword crawl)
        run: python live_sync.py --only finder --min-visits 20000 --min-ccu 25

      # One-way door: a finder pass that crawls but fails to persist would
      # re-crawl the same keyword slice next run. Fail visibly instead.
      - name: Push catalog to release store
        if: always()
        run: python db_sync.py push

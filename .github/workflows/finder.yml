# RbxScout finder — the discovery pass.
#
# Grows the catalog: front-page charts + Rolimons pool + the next
# 100-keyword slice of the 661-word dictionary. Every candidate found is
# hydrated immediately (a new game has no stats yet, so it cannot be
# tiered — that first hydration is mandatory). The known-game refresh
# queue is NOT drained here: that is the hydrator workflow's job, so a
# slow keyword crawl can never starve hot games' stats again.
#
# The DB is the repo: every run commits rbx_scout.db back. Both this
# workflow and hydrator.yml declare the SAME concurrency group, which
# acts as a repo-wide mutex — a run of either waits for the other, so
# two runs can never push the SQLite file simultaneously. (Git cannot
# line-merge a binary DB; this lock is what makes the two-writer setup
# safe.)
#
# Manual runs: Actions tab -> "Finder (30 min)" -> "Run workflow"

name: Finder (30 min)

on:
  schedule:
    # :13 and :43 — off the high-load hour boundaries (GitHub docs), and
    # never colliding with the hydrator's :02/:07/… slots anyway (the
    # shared concurrency lock would queue them regardless).
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Search-proxy fallback pool for the keyword crawler: the omni-search
  # endpoint throttles GitHub runner IPs, so keyword requests are tried
  # through these Cloudflare Worker mirrors first and fall back to direct
  # Roblox last. Add a repo variable (Settings -> Secrets and variables ->
  # Actions -> Variables) named RBXSCOUT_SEARCH_PROXY_URLS holding the
  # worker URL(s), comma-separated. Leave empty to crawl direct-only.
  RBXSCOUT_SEARCH_PROXY_URLS: ${{ vars.RBXSCOUT_SEARCH_PROXY_URLS || '' }}

# ⚠️ Keep this group IDENTICAL to hydrator.yml — the shared literal string
# IS the cross-workflow mutex. Changing one without the other re-opens
# the two-writer race on rbx_scout.db.
concurrency:
  group: rbxscout-sync
  cancel-in-progress: false   # never kill a run mid-flight; queue instead

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # pacer can stretch on 429s; 30 min is generous

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (matches the tested local env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (protects the catalog from bad pushes)
        run: python -m pytest tests -q

      - name: Run finder (discovery + keyword crawl)
        run: python live_sync.py --only finder --min-visits 20000 --min-ccu 25

      # SQLite runs in WAL mode: fold the write-ahead log into the main
      # .db file so the commit captures ALL new data, not just the last
      # checkpoint.
      - name: Checkpoint SQLite WAL
        if: always()
        run: python -c "import sqlite3; c = sqlite3.connect('rbx_scout.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

      - name: Commit updated catalog
        if: always()
        run: |
          git config user.name  "rbxscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rbx_scout.db rbx_scout.db.sync_state
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "sync: catalog update (finder)"
          fi
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

# Publishes the dashboard container image to GHCR on every push to main.
# ClawCloud Run pulls ghcr.io/OWNER/rbxscout-dashboard:latest — set the image
# to auto-update (or redeploy) after each run of this workflow.
name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rbxscout-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/rbxscout-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

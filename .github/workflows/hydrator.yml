# RbxScout hydrator — the frequent pass.
#
# Refreshes stats (CCU / visits / favorites) for games ALREADY in the
# catalog by draining the tier-due queue. Cloudflare's Cron Trigger invokes
# workflow_dispatch every 5 minutes; GitHub's internal schedule trigger is
# intentionally disabled because GitHub does not guarantee schedule timing.
#
# The catalog no longer lives in git commits. It is the `rbx_scout.db`
# asset of the rolling Release tag `catalog-latest` in this repo:
#   pull (asset -> rbx_scout.db) -> sync -> push (rbx_scout.db -> asset).
# A 2 GiB release asset with no bandwidth limit replaces the old
# "repo as database" commit every 5 minutes. No LFS, no R2, no card.
#
# Race safety is unchanged: both workflows declare the SAME Actions
# concurrency group (`rbxscout-sync`), a repo-wide mutex, so only one
# pull/sync/push cycle can ever run at a time. `queue: max` retains
# pending dispatches while a run is active.
#
# Manual runs: Actions tab -> "Hydrator (5 min)" -> "Run workflow"

name: Hydrator (5 min)

on:
# Automatic dispatching is owned by the Cloudflare Worker in
# cloudflare-worker/wrangler.toml. The hourly GitHub schedule is a BACKSTOP,
# not redundancy for its own sake: on 2026-09-21 the worker was redeployed
# without its cron triggers and the whole 24/7 pipeline silently stalled for
# 3 days — every run was green precisely because none were being started.
# A schedule lives in the workflow file itself and survives worker redeploys,
# so a lost Cloudflare cron now degrades freshness to ~1 h instead of
# "forever". The rbxscout-sync concurrency group serializes backstop runs
# with the 5-min dispatches (extra queued events just no-op through). Note:
# GitHub's schedule trigger is best-effort (~5-30 min jitter) — fine here,
# Cloudflare stays the precision clock.
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # hourly safety net

permissions:
  contents: write   # create/update the catalog-latest release assets

# ⚠️ Keep this group IDENTICAL to expander.yml — the shared literal string
# IS the cross-workflow mutex. Changing one without the other re-opens
# the two-writer race on the catalog release.
concurrency:
  group: rbxscout-sync
  queue: max                 # retain scheduled dispatches while a run is active

env:
  RBXSCOUT_SEARCH_PROXY_URLS: ''   # hydrator never touches the search API

jobs:
  hydrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # pull + hydrate + push of a 60+ MB catalog; the
                          # old 10-min cap killed runs mid-swap (2026-09-17
                          # outage: DB deleted from the release mid-upload)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # The runner's GITHUB_TOKEN: full read/write on this repo's releases.
      # db_sync.py picks it up from the environment automatically.
      - name: Export release-store credentials
        run: echo "RBXSCOUT_GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Set up Python 3.14 (matches the tested local env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pull the current catalog from the catalog-latest release. This runs
      # AFTER the concurrency mutex is held, so it always sees the asset
      # written by the previous serialized run (no stale-checkout problem).
      - name: Pull catalog from release store
        run: python db_sync.py pull

      # No pytest on hydrator ticks: the runner boot + install already eat
      # a chunk of the 5-minute cadence, and the finder workflow guards
      # the code/schema where test-relevant changes actually land.

      - name: Run hydrator (known games only)
        run: python live_sync.py --only hydrator

      # One-way door: the workflow is only green if the fresh catalog
      # actually landed on the release. A failed upload must fail the run.
      - name: Push catalog to release store
        if: always()
        run: python db_sync.py push

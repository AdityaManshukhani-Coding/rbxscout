# UpScale Scouting Tool expander — Atlas Dev seed harvest + discovery-queue drain (every 10 min).
#
# The sole discovery pipeline (ATLAS_PLAN_REVIEW.md), 2026-10-15 cadence
# upgrade (owner request: be first on new games): a ~10-min-throttled
# harvest of atlasdev.gg/analyze
# (ATLAS_THROTTLE_HOURS≈0.16 below; the code default stays 23h for local
# runs) re-checks the frontier head pages AND advances a ROLLING cursor
# through the rest of the gated index (~274 pages, ATLAS_ROLL_PAGES=8 per
# harvest here) on every harvest, so every page is visited roughly every
# 6 h and NEW LISTINGS surface within ~10 min of Atlas publishing them —
# roughly 3x faster than the 1h-throttle era at ~2.4x the polite volume
# (~66 pages/h at the 3s request delay, same robots-permitted crawl).
# Each run FIRST drains a bounded slice of the discovery queue
# through the strict gate — drain-only, even when the proxy pool (which
# gates the Atlas fetch) is down — so evaluation of already-discovered
# seeds never stalls. Only games meeting 20k visits / 25 CCU are stored —
# everything else is recorded in discovery_queue as dedup memory, never as
# a catalog row.
#
# The catalog lives on the rolling Release `catalog-latest` (asset
# rbx_scout.db): pull -> sync -> push, same as hydrator.
#
# ⚠️ Race safety: this workflow declares the SAME `rbxscout-sync` Actions
# concurrency group as hydrator.yml. The DB is one binary
# SQLite file — two pull/sync/push cycles running at once would silently
# drop one run's data. GitHub enforces the group repo-wide as a mutex;
# with queue:max removed (2026-10-13 pending-chain outage), GitHub's default
# auto-cancels stale pending runs instead of letting them pile up behind a
# 40-min cycle.
#
# Knobs (repo Variables, optional): ATLAS_SWEEP_PAGES (frontier head pages
# re-checked per harvest — the rolling tail cursor adds ~25 pages/run on
# every sustainable harvest; 0 = kill switch), ATLAS_STAT_PAGES
# (provisional first-paint rows per harvest, 0 disables),
# ATLAS_REQUEST_DELAY (polite per-request delay), ATLAS_DEEP_EVERY_DAYS
# (full catch-up sweep cadence, backstop only now), EXPAND_QUEUE_BATCHES# (queue-drain batches per run). REMOVAL_SWEEP_HOURS / REMOVAL_STALE_HOURS /
# REMOVAL_SWEEP_MAX_GAMES (take-down removal sweep, soft-delete only).
# Manual runs: Actions tab -> "Expander — Atlas Dev harvest + drain (30 min)" -> Run workflow

name: Expander — Atlas Dev harvest + drain (10 min)

on:
# Automatic dispatching is owned by the Cloudflare Worker in
# cloudflare-worker/src/index.js (Expander and Hydrator alternate on the
# 5-min ticks — Expander on the odd ones, 6 slots/h). The 10-minute GitHub
# schedule is a backstop added after the 2026-09-21 worker redeploy dropped
# the Cloudflare crons and silently stalled the whole pipeline for 3 days
# (see hydrator.yml). Extra triggers no-op through the concurrency group
# when the worker is healthy; the Atlas harvest self-throttles to ~10 min.
  workflow_dispatch:
  schedule:
    # Every 10 min on off-peak minutes (:07/:17/...) — near-parity with the
    # Cloudflare worker's odd-tick slots (:05/:15/...). (2026-10-05: the
    # worker stopped dispatching ~16:15Z and the on-the-hour backstop barely
    # fired — GitHub suppresses :00 schedules under load.)
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write   # create/update the catalog-latest release assets

env:
  # Atlas fetches go direct by default (robots.txt allows crawling; tiny
  # volume). Flip-ready: set this repo Variable to your proxy worker URL(s)
  # and Atlas traffic shifts through them with zero code change.
  RBXSCOUT_SEARCH_PROXY_URLS: ${{ vars.RBXSCOUT_SEARCH_PROXY_URLS || '' }}
  # Split catalog: the push uploads Discord links only as the ENCRYPTED
  # contacts.bundle sidecar. The key lives in repo secrets (same hex value
  # as the laptop's contacts.key and the Streamlit CONTACTS_KEY secret).
  CONTACTS_KEY: ${{ secrets.CONTACTS_KEY || '' }}
  # Atlas harvest knobs (defaults live in scout_core.py). ATLAS_ROLL_PAGES
  # is sized for the 10-min cadence: 8 rolling pages × 6 harvests/h keeps
  # the ~274-page tail circuit at ~6 h while holding the polite volume at
  # ~66 Atlas pages/h (the 1h era fetched ~28/h).
  ATLAS_ROLL_PAGES: '8'
  ATLAS_SWEEP_PAGES: ${{ vars.ATLAS_SWEEP_PAGES || '' }}
  ATLAS_STAT_PAGES: ${{ vars.ATLAS_STAT_PAGES || '' }}
  ATLAS_REQUEST_DELAY: ${{ vars.ATLAS_REQUEST_DELAY || '' }}
  ATLAS_DEEP_EVERY_DAYS: ${{ vars.ATLAS_DEEP_EVERY_DAYS || '' }}
  # Queue-drain budget (default 20 batches = 1,000 candidates/run):
  EXPAND_QUEUE_BATCHES: ${{ vars.EXPAND_QUEUE_BATCHES || '' }}

# ⚠️ Keep this group IDENTICAL to hydrator.yml — the shared
# literal string IS the cross-workflow mutex.
concurrency:
  group: rbxscout-sync
  cancel-in-progress: false  # queued siblings wait; with queue:max removed,
                             # GitHub's default keeps only the LATEST pending
                             # run and auto-cancels older pending backlog

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # must fit a full deep sweep (275 pages) + drain;
                             # steady-state runs finish in ~2 min anyway

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Export release-store credentials
        run: echo "RBXSCOUT_GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Set up Python 3.14 (matches the tested local env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull catalog from release store
        run: python db_sync.py pull

      - name: Run test suite (protects the catalog from bad pushes)
        run: python -m pytest tests -q

      # ------------------------------------------------------------------
      # DRAIN FIRST (2026-10-14): the steps below gate the harvest on the
      # free-proxy pool and Scrape.do credits; when that gate fails, the job
      # used to die BEFORE the queue drain too — 6k discovered seeds sat
      # un-evaluated for hours while new-game intake was zero. Evaluation
      # (no Atlas traffic) now runs unconditionally ahead of the harvest.
      # ------------------------------------------------------------------
      - name: Drain discovery queue first (independent of Atlas/proxy health)
        run: python live_sync.py --only drain --min-visits 20000 --min-ccu 25

      # atlasdev.gg 403s many datacenter/runner IP ranges (2026-10-05 run
      # #722: BLUE — the harvest was throttled AND cloud fetches are
      # unreliable from
      # runner IPs). Validate the same free public proxy pool the prufer
      # pre-pass uses (~9% yield ≈ 200 working proxies, ~4 min) and route the
      # Failure policy (2026-10-11, scout request): the pool IS the primary
      # route. When fewer than 20 free proxies validate, the harvest is NOT
      # allowed to fall back to direct runner-IP fetches (atlasdev.gg 403s
      # runner ranges — a direct harvest is ~100+ guaranteed-403 requests
      # and a lost harvest day). Instead: Spider.do-form failover runs on
      # Scrape.do (token already wired, tens of credits per attempt — inside
      # the 1,000/mo free tier), and with NO token configured the whole job
      # fails loudly (non-zero exit) so the queue stays safe from a direct
      # 403 storm. Exit is gated: set ATLAS_MIN_PROXY_POOL=0 in repo
      # Variables to re-enable direct harvesting as the old fallback.
      # 2026-10-12: the 1,000/mo free-credit bucket is exhausted locally —
      # until it tops up, keep ATLAS_MIN_PROXY_POOL unset (fail-loud on the
      # malformed small-pool path) so a dead-token day cannot silently
      # zero the discovery queue; the parser now accepts prufer's bare
      # ip:port pool export (run #722 discarded ALL 191 working proxies).
      - name: Validate free-proxy pool for Atlas fetches
        run: python prufer.py > atlas_proxies.txt; test -n "$(cat atlas_proxies.txt)"

      - name: Run expander (Atlas harvest + queue drain)
        env:
          ATLAS_THROTTLE_HOURS: "0.16"   # harvest on every 10-min run (owner request 2026-10-15: new listings within ~10 min)
          # Scrape.do token as an ALWAYS-on source (2026-10-11). When the
          # free pool validated, the template is appended as the LAST failover
          # entry (credits burn only when the pool fails on a fetch). When
          # the pool is too small, the token is the FIRST entry (the whole
          # harvest runs through it). With neither pool nor token the job
          # fails loudly ATLAS_MIN_PROXY_POOL enforcement below.
          RBXSCOUT_SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN || '' }}
        run: |
          POOL=$(grep -c . atlas_proxies.txt || true)
          echo "validated proxies: ${POOL}"
          if [ "${POOL}" -ge 20 ]; then
            export RBXSCOUT_SEARCH_PROXY_URLS="$(paste -sd, atlas_proxies.txt)${RBXSCOUT_SCRAPE_DO_TOKEN:+,https://api.scrape.do?token=${RBXSCOUT_SCRAPE_DO_TOKEN}&url={url}}${RBXSCOUT_SEARCH_PROXY_URLS:+,${RBXSCOUT_SEARCH_PROXY_URLS}}"
            echo "harvesting via ${POOL} free proxies (Scrape.do = last-resort failover)"
          elif [ -n "${RBXSCOUT_SCRAPE_DO_TOKEN}" ]; then
            export RBXSCOUT_SEARCH_PROXY_URLS="https://api.scrape.do?token=${RBXSCOUT_SCRAPE_DO_TOKEN}&url={url},direct"
            echo "pool too small (${POOL}); harvesting via Scrape.do failover"
          elif [ "${ATLAS_MIN_PROXY_POOL:-20}" -gt "${POOL}" ]; then
            echo "proxy pool too small (${POOL}) and NO Scrape.do token — refusing direct harvest (guaranteed 403s on runner IPs)."
            echo "Set ATLAS_MIN_PROXY_POOL=0 or add SCRAPE_DO_TOKEN to re-enable direct."
            exit 1
          else
            export RBXSCOUT_SEARCH_PROXY_URLS="direct"
            echo "ATLAS_MIN_PROXY_POOL=0 — harvesting direct as the legacy fallback"
          fi
          python live_sync.py --only expander --min-visits 20000 --min-ccu 25

      # ------------------------------------------------------------------
      # Take-down removal sweep (2026-10-17, owner request): games Roblox
      # removes must leave the site. Two-phase, all on GHA:
      #   1. the harvest above stamps atlas_last_seen for every ID Atlas
      #      still lists — a full ~6 h circuit miss + 72 h (REMOVAL_STALE_HOURS)
      #      turns the row into a suspect;
      #   2. this sweep verifies suspects DIRECTLY against the live Roblox
      #      games API (batched 50/call) and soft-deletes only CONFIRMED
      #      removals (removed=1 — dashboard hides, ccu_history/contacts stay:
      #      the harvest stamps re-add a game instantly if Roblox/Atlas
      #      relists it). Self-throttled ~6 h, capped 400 games/run,
      #      fail-CLOSED: an API outage writes nothing. Runs AFTER the
      #      expander so the just-written stamps are honored, BEFORE the
      #      push so this run's tombstones ship with the catalog.
      # ------------------------------------------------------------------
      - name: Take-down removal sweep (soft-delete verified removals only)
        if: always()
        env:
          REMOVAL_SWEEP_HOURS: ${{ vars.REMOVAL_SWEEP_HOURS || '6' }}
          REMOVAL_STALE_HOURS: ${{ vars.REMOVAL_STALE_HOURS || '72' }}
          REMOVAL_SWEEP_MAX_GAMES: ${{ vars.REMOVAL_SWEEP_MAX_GAMES || '400' }}
        run: |
          python live_sync.py --only removal || echo "removal sweep failed (fail-open; next run retries)"
      # ------------------------------------------------------------------
      # Rotrends daily sweep + shallow backfill (HYDRATION_SOURCES.md
      # Phase 1): the cold tail (T5-T7, ~23k games) gets its daily CCU
      # snapshot from api.rotrends.com instead of spending the Roblox
      # batch budget. Sliced: each expander run does a bounded slice
      # (ROTRENDS_SWEEP_MAX_GAMES + ROTRENDS_BACKFILL_MAX_GAMES); the
      # next expander run continues the rotation. Fail-open: a rotrends
      # outage must not fail the expansion push (|| true).
      # ------------------------------------------------------------------
      - name: Rotrends daily sweep slice (cold tail T5-T7)
        if: always()
        env:
          ROTRENDS_RPS: '8'
          # Slice sized to keep the whole expander under ~5 min at the 10-min
          # cadence: the run holds the rbxscout-sync mutex, so a long sweep
          # starves the interleaved hydrator ticks (first run 2026-10-08: a
          # 6,000-game slice took 22 min of sweep alone and queued 6
          # hydrator ticks). 700 games ≈ 1.5-2 min at 8 req/s; 12 expander
          # runs/h × 700 keeps the same ~8k games/h sweep rate the 30-min
          # era averaged (2,000 × 2/h + hydrator spaced slices).
          ROTRENDS_SWEEP_MAX_GAMES: ${{ vars.ROTRENDS_SWEEP_MAX_GAMES || '700' }}
          ROTRENDS_BACKFILL_MAX_GAMES: ${{ vars.ROTRENDS_BACKFILL_MAX_GAMES || '70' }}
        run: |
          python rotrends_sweep.py || echo "rotrends sweep failed (fail-open; next run continues)"

      # One-way door: an expansion pass that evaluated IDs but failed to
      # persist would re-evaluate the same seeds next run (the Atlas cursor
      # only advances after a successful DB write). Fail visibly.
      - name: Push catalog to release store
        if: always()
        run: python db_sync.py push

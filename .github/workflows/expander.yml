# RbxScout expander — Atlas Dev seed harvest + discovery-queue drain (every 30 min).
#
# The sole discovery pipeline (ATLAS_PLAN_REVIEW.md): a daily 24h-throttled
# harvest of atlasdev.gg/analyze enqueues mid-tier universe IDs into the
# priority discovery queue; every run then drains a bounded slice of the
# queue through the strict gate. Only games meeting 20k visits / 25 CCU are
# stored — everything else is recorded in discovery_queue as dedup memory,
# never as a catalog row.
#
# The catalog lives on the rolling Release `catalog-latest` (asset
# rbx_scout.db): pull -> sync -> push, same as hydrator.
#
# ⚠️ Race safety: this workflow declares the SAME `rbxscout-sync` Actions
# concurrency group as hydrator.yml. The DB is one binary
# SQLite file — two pull/sync/push cycles running at once would silently
# drop one run's data. GitHub enforces the group repo-wide as a mutex;
# `queue: max` retains pending dispatches while a run is active.
#
# Knobs (repo Variables, optional): ATLAS_SWEEP_PAGES (index pages per daily
# harvest, 0 = kill switch), ATLAS_STAT_PAGES (provisional first-paint rows
# per harvest, 0 disables), ATLAS_REQUEST_DELAY (polite per-request delay),
# ATLAS_DEEP_EVERY_DAYS (full catch-up sweep cadence), EXPAND_QUEUE_BATCHES
# (queue-drain batches per run).
#
# Manual runs: Actions tab -> "Expander — Atlas Dev harvest + drain (30 min)" -> Run workflow

name: Expander — Atlas Dev harvest + drain (30 min)

on:
# Automatic dispatching is owned by the Cloudflare Worker in
# cloudflare-worker/wrangler.toml (:15/:45 every 30 min). The 3-hour GitHub
# schedule is a backstop added after the 2026-09-21 worker redeploy dropped
# the Cloudflare crons and silently stalled the whole pipeline for 3 days
# (see hydrator.yml). Discovery tolerates a 3 h gap — the queue drains a
# bounded slice each run anyway; freshness of stats is the hydrator's job.
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # safety net: every 3 hours

permissions:
  contents: write   # create/update the catalog-latest release assets

env:
  # Atlas fetches go direct by default (robots.txt allows crawling; tiny
  # volume). Flip-ready: set this repo Variable to your proxy worker URL(s)
  # and Atlas traffic shifts through them with zero code change.
  RBXSCOUT_SEARCH_PROXY_URLS: ${{ vars.RBXSCOUT_SEARCH_PROXY_URLS || '' }}
  # Atlas harvest knobs (defaults live in scout_core.py):
  ATLAS_SWEEP_PAGES: ${{ vars.ATLAS_SWEEP_PAGES || '' }}
  ATLAS_STAT_PAGES: ${{ vars.ATLAS_STAT_PAGES || '' }}
  ATLAS_REQUEST_DELAY: ${{ vars.ATLAS_REQUEST_DELAY || '' }}
  ATLAS_DEEP_EVERY_DAYS: ${{ vars.ATLAS_DEEP_EVERY_DAYS || '' }}
  # Queue-drain budget (default 10 batches = 500 candidates/run):
  EXPAND_QUEUE_BATCHES: ${{ vars.EXPAND_QUEUE_BATCHES || '' }}

# ⚠️ Keep this group IDENTICAL to hydrator.yml — the shared
# literal string IS the cross-workflow mutex.
concurrency:
  group: rbxscout-sync
  queue: max                 # retain dispatches while another workflow runs

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # must fit a full deep sweep (275 pages) + drain;
                             # steady-state runs finish in ~2 min anyway

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Export release-store credentials
        run: echo "RBXSCOUT_GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Set up Python 3.14 (matches the tested local env)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull catalog from release store
        run: python db_sync.py pull

      - name: Run test suite (protects the catalog from bad pushes)
        run: python -m pytest tests -q

      - name: Run expander (Atlas harvest + queue drain)
        run: python live_sync.py --only expander --min-visits 20000 --min-ccu 25

      # One-way door: an expansion pass that evaluated IDs but failed to
      # persist would re-evaluate the same seeds next run (the Atlas cursor
      # only advances after a successful DB write). Fail visibly.
      - name: Push catalog to release store
        if: always()
        run: python db_sync.py push
